name: Docs

# Builds the Antora documentation site under docs/ and publishes it to GitHub Pages (the gh-pages branch)
# on every push to main. Adapted from the Antora-build/GitHub-Pages-publish stages of the Java/Maven
# develop.yml/main.yml template in the iru-setup-java-github-workflows skill, minus everything Java/Maven-
# specific (JDK setup, static analysis, SonarQube, the Maven site report, Maven Central publish) since this
# repository has no pom.xml — it's a skills catalog, not a Java library.
on:
  push:
    branches: [ main ]

permissions:
  contents: write # crazy-max/ghaction-github-pages pushes the built site to the gh-pages branch

jobs:
  build-and-deploy:
    name: Build and publish Antora documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs toolchain
        working-directory: docs
        run: npm ci

      - name: Show Antora version
        working-directory: docs
        run: npx antora -v

      - name: Validate Mermaid diagrams (static, parse and headless-browser render)
        working-directory: docs
        run: npm i --no-save mermaid@11 jsdom@31 puppeteer@25 && npm run validate:mermaid

      - name: Build Antora docs
        working-directory: docs
        run: npx antora antora-playbook.yml

      - name: Index the site for search
        working-directory: docs
        run: npx pagefind --site build/site

      - name: Check site size
        working-directory: docs
        run: |
          size=$(du -sk build/site | cut -f1)
          echo "build/site is ${size} KiB"
          if [ "$size" -gt 960000 ]; then echo "::error::site over 960,000 KiB"; exit 1; fi
          if [ "$size" -gt 900000 ]; then echo "::warning::site over 900,000 KiB"; fi

      - name: Add .nojekyll
        run: touch ./docs/build/site/.nojekyll

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: ./docs/build/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
